name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Required gate: fast smoke on critical flows. Blocks merge (required check).
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-report
          path: playwright-report
        continue-on-error: true

  # Nightly + PR-to-critical regression. Publish report + healing log.
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:regression
      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-report
          path: playwright-report
      - name: Upload healing log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: healing-log
          path: tests/.healing.log
        continue-on-error: true

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:typecheck
      - run: npm run build